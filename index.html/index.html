<!DOCTYPE html>
<html>

<head>
 
    <title>小澤ゼミ紹介サイト</title>

  <style>
    nav {
      background-color: #333;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 10px;
      padding: 8px 15px;
      border-radius: 5px;
    }

    nav a:hover {
      background-color: #555;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      padding: 10px;
      min-width: 250px;
    }

    .dropdown-content a {
      display: block;
      padding: 10px;
      color: black;
    }

    .dropdown-content a:hover {
      background-color: #ddd;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* 全体のリセットと基本設定 */
body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  background-color: #f9f9f9;
  margin: 0;
  padding: 50px 0;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

/* スライダーの余白設定 */
.swiper {
  width: 100%;
  padding: 20px 0;
}

/* リンクタグのデフォルト装飾を消す */
.card-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

/* カードのデザイン */
.card {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  transition: transform 0.2s, box-shadow 0.2s;
  height: 100%;
}

/* ホバー時に少し浮き上がらせる演出 */
.card-link:hover .card {
  transform: translateY(-5px);
  box-shadow: 0 8px 15px rgba(0,0,0,0.1);
}

/* 画像部分 */
.card-img img {
  width: 100%;
  height: 200px;
  object-fit: cover; /* 画像の比率を崩さずにトリミング */
}

/* テキストコンテンツ部分 */
.card-content {
  padding: 20px;
}

.category {
  font-size: 12px;
  color: #666;
  border: 1px solid #ccc;
  padding: 2px 8px;
  display: inline-block;
  margin-bottom: 10px;
}

.card-content h3 {
  font-size: 16px;
  margin: 10px 0;
  line-height: 1.4;
  color: #333;
}

.date {
  font-size: 12px;
  color: #999;
  margin-bottom: 15px;
}

/* タグのスタイリング */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  font-size: 12px;
  color: #333;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 3px 10px;
}
  </style>

</head>
