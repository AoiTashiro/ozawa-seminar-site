<!DOCTYPE html>
<html lang="ja">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>小澤ゼミ紹介シミュレーション</title>
      <style>
            /* ========== CSS (見た目の設定) ========== */
            body {
                  background-color: #111;
                  /* 背景を暗く */
                  color: #eee;
                  font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
                  margin: 0;
            }

            #game-container {
                  width: 800px;
                  height: 500px;
                  background-color: #000;
                  border: 2px solid #444;
                  border-radius: 8px;
                  padding: 30px;
                  box-sizing: border-box;
                  display: flex;
                  flex-direction: column;
                  position: relative;
                  box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            }

            #text-box {
                  flex-grow: 1;
                  font-size: 1.4rem;
                  line-height: 1.8;
                  white-space: pre-wrap;
                  /* 改行をそのまま表示 */
            }

            #indicator {
                  text-align: right;
                  font-size: 1.2rem;
                  color: #0ff;
                  animation: blink 1s infinite;
                  display: none;
                  /* 初期状態は非表示 */
                  cursor: pointer;
            }

            @keyframes blink {

                  0%,
                  100% {
                        opacity: 1;
                  }

                  50% {
                        opacity: 0;
                  }
            }

            /* 選択肢ボタンのスタイル */
            #choices-area {
                  display: flex;
                  flex-direction: column;
                  gap: 15px;
                  margin-top: 20px;
            }

            .choice-btn {
                  background-color: #222;
                  color: #fff;
                  border: 1px solid #0ff;
                  padding: 15px;
                  font-size: 1.2rem;
                  cursor: pointer;
                  border-radius: 4px;
                  transition: 0.2s;
            }

            .choice-btn:hover {
                  background-color: #0ff;
                  color: #000;
            }

            /* 名前入力エリアのスタイル */
            #input-area {
                  display: none;
                  text-align: center;
                  margin-top: 40px;
            }

            #player-name-input {
                  font-size: 1.2rem;
                  padding: 10px;
                  width: 50%;
                  background: #222;
                  color: #fff;
                  border: 1px solid #555;
            }

            #submit-name {
                  font-size: 1.2rem;
                  padding: 10px 20px;
                  cursor: pointer;
            }
      </style>
</head>

<body>

      <div id="game-container">
            <div id="text-box"></div>

            <div id="input-area">
                  <input type="text" id="player-name-input" placeholder="プレイヤー名を入力">
                  <button id="submit-name">決定</button>
            </div>

            <div id="choices-area"></div>
            <div id="indicator">▼ クリックして次へ</div>
      </div>

      <script>
            /* ========== JavaScript (ゲームの動きの設定) ========== */
            const textBox = document.getElementById('text-box');
            const indicator = document.getElementById('indicator');
            const choicesArea = document.getElementById('choices-area');
            const inputArea = document.getElementById('input-area');
            const nameInput = document.getElementById('player-name-input');
            const submitBtn = document.getElementById('submit-name');
            const gameContainer = document.getElementById('game-container');

            let playerName = "主人公";

            // 待機用関数 (指定ミリ秒待つ)
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            // クリック待ち関数
            const waitClick = () => {
                  return new Promise(resolve => {
                        indicator.style.display = 'block';

                        const clickHandler = () => {
                              indicator.style.display = 'none';
                              gameContainer.removeEventListener('click', clickHandler);
                              resolve();
                        };

                        // 少し遅らせてイベントを登録（連続クリック防止）
                        setTimeout(() => {
                              gameContainer.addEventListener('click', clickHandler);
                        }, 100);
                  });
            };

            // テキスト表示関数
            const showText = (text, append = false) => {
                  if (append) {
                        textBox.innerHTML += "\n" + text;
                  } else {
                        textBox.innerHTML = text;
                  }
            };

            // 選択肢表示関数
            const askChoices = (choices) => {
                  return new Promise(resolve => {
                        choicesArea.innerHTML = ''; // クリア
                        choices.forEach((choiceText, index) => {
                              const btn = document.createElement('button');
                              btn.className = 'choice-btn';
                              btn.innerText = choiceText;
                              btn.onclick = () => {
                                    choicesArea.innerHTML = ''; // 押されたら消す
                                    resolve(index + 1); // 1, 2, ... を返す
                              };
                              choicesArea.appendChild(btn);
                        });
                  });
            };

            // 名前入力関数
            const askName = () => {
                  return new Promise(resolve => {
                        inputArea.style.display = 'block';
                        submitBtn.onclick = () => {
                              const val = nameInput.value.trim();
                              if (val) playerName = val;
                              inputArea.style.display = 'none';
                              resolve();
                        };
                  });
            };

            // メインのゲーム進行関数
            async function startGame() {
                  showText("【仮想空間演出開始】\n\n①4秒\n・多色の物体が画面奥から手前へ高速で流れてくる\n・サマーウォーズの電脳空間のような雰囲気\n・グレー、紫ピンク、黄色、水色、黄緑、赤を使用\n・プレイヤーが空間を移動しているような没入感\n・電子音あり");
                  await sleep(4000);

                  showText("②1秒\nLanguage ➤ Japanese\nを自動選択する演出。\n・近未来UI風 / カーソル自動移動 / 決定音");
                  await sleep(1000);

                  showText("③1秒\nログイン画面表示。\nLog in\naccount : ozawa2026\npassword : ********\nを自動入力する演出。\n・タイピング風 / 近未来UI / 入力音");
                  await sleep(1000);

                  showText("④プレイヤー名入力");
                  await askName();

                  showText("⑤2秒\nWelcome to Ozawa Seminar !\nを画面中央に大きく表示。\n・強い発光 / インパクト重視 / 電子音 / 背景は暗め");
                  await sleep(2000);

                  showText("⑤3秒\nWelcome to Ozawa Seminar ! の文字へ吸い込まれるように移行。\n・青系のワープ空間 / 奥へ進む演出 / 高速移動感 / 光の線が流れる / 最後はホワイトアウト");
                  await sleep(3000);

                  // --- 日常パート ---
                  showText(`【背景A：廊下】 【BGMA：足音】\n${playerName}「今日から経済学部最強の小澤ゼミが始まるぞ。まずは教室に向かおう。」`);
                  await waitClick();

                  showText(`${playerName}「（歩き始めた足は教室に近づくにつれて軽くなる。気づかぬうちに新たな挑戦に心が昂っているのだろう。）」`);
                  await waitClick();

                  showText(`【背景B：ドア前】 【BGMA足音停止】（0.5秒フェードアウト）`);
                  await sleep(500);
                  showText(`「（そんなことを思っている間に教室に着いていた。）」`);
                  await waitClick();

                  showText(`【背景C：ドア開】（ホワイトアウト） 【SE：ドア開】\n${playerName}「（教室の扉を開けた瞬間、新たな高みに踏み入ったことを自覚する。）」`);
                  await waitClick();

                  showText(`【背景D：教室ドア前】 【BGM：賑やか】\n${playerName}「賑やかだな。」`);
                  await waitClick();
                  showText(`${playerName}「よーしとりあえず...」`);
                  await sleep(500);

                  // 【選択肢A】ループ処理
                  while (true) {
                        let choiceA = await askChoices(["①小澤先生に挨拶に行く", "②ゼミ生に挨拶に行く"]);

                        if (choiceA === 1) {
                              showText(`【背景E：教室黒板前】（画面右から黒くなって移動した風に）\n${playerName}「小澤先生！本日からよろしくお願いします！」`);
                              await waitClick();
                              showText(`小澤先生「おう、よう来たな。そんな固くならんでええ。適当に座れ。」`);
                              await waitClick();
                              break; // ループを抜ける
                        } else {
                              if (Math.random() < 0.5) {
                                    showText(`【背景F：教室窓側】\n？？？（けいご）「おいおい。先に先生への挨拶や。筋は通しとかねぇとな。」`);
                              } else {
                                    showText(`【背景G：教室廊下側】\n？？？（ぜん）「小澤先生をスルーとはとんでもない新入りが入ってきたもんやな。」`);
                              }
                              await waitClick();
                              showText(`（...先に先生に挨拶した方が良さそうだ。）`);
                              await waitClick();
                        }
                  }

                  // 【選択肢B】
                  showText(`【背景H：教室黒板前逆向き】\n${playerName}「どこに座ろうかな？」`);
                  await sleep(500);
                  let choiceB = await askChoices(["①資料を読んでいる先輩のところに行く", "②話している先輩のところに行く"]);

                  if (choiceB === 1) {
                        showText(`${playerName}「真面目そうだな。よし。」`);
                        await waitClick();
                        showText(`${playerName}「${playerName}です。今日からよろしくお願いします。」`);
                        await waitClick();
                        showText(`真面目A先輩「よろしく。今日は初めて？」`);
                        await waitClick();
                        showText(`${playerName}「はい、今日が初めてです。」`);
                        await waitClick();
                        showText(`真面目A先輩「そっか。最初は緊張するよね。」`);
                        await waitClick();
                        showText(`真面目A先輩「聞きたいことがあったらなんでも聞いてね。」`);
                        await waitClick();
                        showText(`${playerName}「じゃあ...」`);
                        await waitClick();
                  } else {
                        showText(`${playerName}「賑やかそうだな。よし。」`);
                        await waitClick();
                        showText(`${playerName}「${playerName}です！今日からよろしくお願いします！」`);
                        await waitClick();
                        showText(`話B先輩「おぉ！これからよろしくね！！」`);
                        await waitClick();
                        showText(`話C先輩「おぉ今日初めてか！そんな固くならなくて大丈夫よ。」`);
                        await waitClick();
                        showText(`${playerName}「すごく緊張してます。」`);
                        await waitClick();
                        showText(`話B先輩「最初はみんなそんな感じだったよ。」\n話C先輩「わからないことあったら何でも聞いてくれい。」`);
                        await waitClick();
                        showText(`${playerName}「じゃあ...」`);
                        await waitClick();
                  }

                  // 【選択肢C】
                  showText(`質問内容`);
                  await sleep(500);
                  let choiceC = await askChoices(["①「ディスカッションって役割分担とかあるんですか？」", "②「このゼミってどんな人がいるんですか？」"]);

                  // 分岐処理
                  if (choiceC === 1) {
                        showText(`${playerName}「ディスカッションって役割分担とかあるんですか？」`);
                        await waitClick();
                        let senpai = choiceB === 1 ? "真面目A先輩" : "話B先輩";
                        let senpai2 = choiceB === 1 ? "真面目A先輩" : "話C先輩";

                        showText(`${senpai}「あるよ。毎回班ごとに決めるんだ。」`);
                        await waitClick();
                        showText(`${playerName}「例えばどんな役割があるんですか？」`);
                        await waitClick();
                        showText(`${senpai}「発表者にタイムキーパー、進行役や記録係が主な役割だよ。最初は周りの先輩を頼るといいよ。」`);
                        await waitClick();
                        showText(`${playerName}「はい。そうします。」`);
                        await waitClick();
                        showText(`${senpai2}「せっかくだから今日のThe Wall Street Journalを一緒に見てみようか。」`);
                        await waitClick();
                  } else {
                        showText(`${playerName}「このゼミってどんな人がいるんですか？」`);
                        await waitClick();

                        if (choiceB === 1) {
                              showText(`真面目A先輩「いろんな人がいるよ。」`);
                              await waitClick();
                              showText(`${playerName}「どんな人がいるんですか？」`);
                              await waitClick();
                              showText(`真面目A先輩「私たちの代はお酒が好きな人が多いかな？」`);
                              await waitClick();
                              showText(`${playerName}「それは楽しそうですね。他にはどんな方がいるんですか？」`);
                              await waitClick();
                              showText(`真面目A先輩「やる気がなさそうに見えるけど、秘めてる力は底が見えないよ。」`);
                              await waitClick();
                              showText(`${playerName}「それはすごいですね。他にはどんな方が？」`);
                              await waitClick();
                              showText(`真面目A先輩「ディスカッションになると急に人が変わったように饒舌になる人もいるかな。\n普段は静かなのに、議論が始まるとまるで別人みたいになるんだよね。」`);
                              await waitClick();
                              showText(`${playerName}「小澤ゼミにはいろいろな人がいるんですね。」`);
                              await waitClick();
                              showText(`真面目A先輩「そうなんだ。せっかくだし、このまま今日のThe Wall Street Journalを一緒に見てみようか。」`);
                              await waitClick();
                        } else {
                              showText(`話B先輩「いろんな人がいるよ。」`);
                              await waitClick();
                              showText(`${playerName}「どんな人がいるんですか？」`);
                              await waitClick();
                              showText(`話B先輩「機嫌がいいと帰りにみんなにドーナツをおごってくれる人がいるよ。」`);
                              await waitClick();
                              showText(`${playerName}「楽しそうです。他にはどんな方がいるんですか？」`);
                              await waitClick();
                              showText(`話C先輩「インドネシアに帰省しているのにオンラインで馬券を買っている人がいるよ。」`);
                              await waitClick();
                              showText(`${playerName}「それはすごいですね。他にはどんな方が？」`);
                              await waitClick();
                              showText(`話B先輩「旅行好きで海外によく行ってお土産を買ってきてくれるんだけど、その買ってきてくれるお土産すべてが美味しくない人がいるよ。」`);
                              await waitClick();
                              showText(`${playerName}「小澤ゼミにはいろいろな人がいるんですね。」`);
                              await waitClick();
                              showText(`話C先輩「ｿｳﾀﾞﾖ。せっかくだし、このまま今日のThe Wall Street Journalを一緒に見てみようか。」`);
                              await waitClick();
                        }
                  }

                  showText(`${playerName}「はい。ありがとうございます。」`);
                  await waitClick();

                  // 【選択肢D】班決め
                  showText(`ゼミ長（声だけ）「ディスカッション始めるよー！班作ってー！」`);
                  await waitClick();
                  showText(`${playerName}「誰と一緒の班になろうか？」`);
                  await sleep(500);

                  let choiceD = await askChoices(["①「真面目そうな人」のところに行く", "②「雰囲気良さそうだな。あそこに行ってみるか。」"]);

                  if (choiceD === 1) {
                        showText(`真面目D先輩「人数ちょうどいいからぜひぜひ。」`);
                        await waitClick();
                        showText(`陽気E先輩「じゃあ簡単に自己紹介しますか。僕はC先輩で趣味は競馬だよ。でこっちが真面目D先輩だよ。」`);
                        await waitClick();
                        showText(`D先輩「よろしく。趣味は漫画だよ。」`);
                        await waitClick();
                        showText(`${playerName}「${playerName}です。よろしくお願いします。」`);
                        await waitClick();
                        showText(`ゼミ長「ディスカッション始めまーす。」\n\n【END】`);
                  } else {
                        showText(`${playerName}「雰囲気良さそうだな。あそこに行ってみるか！」`);
                        await waitClick();
                        showText(`陽気E先輩「ちょうど人探してたところ！一緒にやろうか！！」`);
                        await waitClick();
                        showText(`陽気E先輩「よろしくね！僕は陽気E先輩で趣味は漫画だよ。で、こっちが真面目D先輩だよ。」`);
                        await waitClick();
                        showText(`真面目D先輩「よろしく。趣味は競馬だよ。」`);
                        await waitClick();
                        showText(`ゼミ長「ディスカッション始めまーす。」\n\n【END】`);
                  }
            }

            // ゲーム開始
            startGame();

      </script>
</body>

</html>
