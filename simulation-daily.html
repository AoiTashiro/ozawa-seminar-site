<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小澤ゼミ紹介シミュレーション</title>
    <style>
        /* ========== 全体スタイル (ノベルゲーム仕様) ========== */
        body {
            background-color: #050508;
            color: #eee;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* ゲーム画面全体（ここに背景写真が広がります） */
        #game-container {
            width: 800px;
            height: 500px;
            background-color: #000;
            background-size: cover;
            background-position: center;
            border: 2px solid #333;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* 後から写真を入れるための背景レイヤー */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center;
            transition: background 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 後ほど写真を入れる場所の「目印（薄い文字）」 */
        #bg-placeholder {
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.12);
            /* 奥で非常に薄く表示 */
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            z-index: 1;
        }

        /* 演出用キャンバス（リンクスタートの光） */
        #cyber-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* 画面レイヤー（下詰めに配置） */
        .screen-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* テキストボックスなどを下部に配置 */
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }

        /* ホワイトアウト用マスク */
        #whiteout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* ========== 演出用UI（画面中央に浮かせるもの） ========== */
        .center-ui {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            z-index: 4;
            text-align: center;
        }

        /* ②言語選択 */
        #lang-ui {
            border: 2px solid #00f3ff;
            background: rgba(0, 10, 20, 0.85);
            padding: 20px 40px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .lang-option {
            font-size: 1.5rem;
            margin: 10px 0;
            color: #555;
        }

        .lang-option.active {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
        }

        /* ③ログイン画面 */
        #login-ui {
            font-size: 1.3rem;
            color: #00f3ff;
            text-align: left;
            width: 300px;
            background: rgba(0, 5, 10, 0.85);
            padding: 20px;
            border-left: 4px solid #00f3ff;
        }

        /* ④プレイヤー名入力 */
        #input-ui input {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-bottom: 2px solid #00f3ff;
            color: #fff;
            font-size: 1.6rem;
            text-align: center;
            outline: none;
            padding: 10px;
            margin-bottom: 20px;
            width: 300px;
        }

        #input-ui button {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #00f3ff;
        }

        /* ⑤Welcome大文字 */
        #welcome-ui {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
            transform: scale(0.5);
            opacity: 0;
            transition: transform 2s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 1s;
        }

        #welcome-ui.show {
            transform: scale(1.1);
            opacity: 1;
        }

        /* ========== ゲーム本編（下部テキストボックス） ========== */
        #text-box {
            width: 100%;
            height: 135px;
            /* ↓ここがポイント：黒の75%の薄さにして、奥の背景を見せつつ文字を読みやすくしています */
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #334466;
            border-radius: 8px;
            padding: 15px 25px;
            box-sizing: border-box;
            font-size: 1.25rem;
            line-height: 1.6;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
        }

        #speaker-name {
            color: #00f3ff;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1rem;
            height: 1.2rem;
        }

        #dialogue-text {
            color: #fff;
        }

        /* 選択肢ボタンの表示位置（テキストボックスの上） */
        #choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
            margin-bottom: 15px;
            z-index: 6;
        }

        .choice-btn {
            width: 100%;
            background: rgba(15, 20, 35, 0.9);
            color: #fff;
            border: 1px solid #4466aa;
            padding: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            text-align: center;
        }

        .choice-btn:hover {
            background: #335599;
            border-color: #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        #indicator {
            position: absolute;
            bottom: 15px;
            right: 30px;
            color: #4466aa;
            font-size: 0.9rem;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* 暗転（ブラックアウト）用マスク */
        #blackout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="bg-layer">
            <div id="bg-placeholder"></div>
        </div>

        <canvas id="cyber-canvas" width="800" height="500"></canvas>

        <div id="whiteout"></div>

        <div id="screen" class="screen-layer">
            <div id="center-ui-container" class="center-ui"></div>

            <div id="choices-area"></div>
            <div id="text-box">
                <div id="speaker-name"></div>
                <div id="dialogue-text"></div>
                <div id="indicator" style="display:none;">▼ ENTER</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        const screen = document.getElementById('screen');
        const whiteout = document.getElementById('whiteout');
        const centerUi = document.getElementById('center-ui-container');
        const textBox = document.getElementById('text-box');
        const bgPlaceholder = document.getElementById('bg-placeholder');
        const bgLayer = document.getElementById('bg-layer');

        let playerName = "主人公";
        let warpSpeed = 2;
        let warpMode = "multi";

        // ========== ①〜⑤ 演出用パーティクルシステム ==========
        const colors = {
            multi: ['#888888', '#ff007f', '#ffff00', '#00ffff', '#7fff00', '#ff0000'],
            blue: ['#0033ff', '#0099ff', '#00ffff', '#ffffff']
        };
        class Particle {
            constructor() { this.reset(); this.z = Math.random() * 800; }
            reset() {
                this.x = (Math.random() - 0.5) * 800;
                this.y = (Math.random() - 0.5) * 500;
                this.z = 800;
                this.color = colors[warpMode] ? colors[warpMode][Math.floor(Math.random() * colors[warpMode].length)] : '#fff';
            }
            update() { this.z -= warpSpeed; if (this.z <= 0) this.reset(); }
            draw() {
                if (warpMode === "stop") return;
                let k = 300 / this.z;
                let px = this.x * k + 400; let py = this.y * k + 250;
                if (px >= 0 && px <= 800 && py >= 0 && py <= 500) {
                    ctx.fillStyle = this.color;
                    let size = (800 - this.z) * 0.01;
                    ctx.fillRect(px, py, size, size * 2);
                }
            }
        }
        const particles = Array.from({ length: 150 }, () => new Particle());
        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.3)';
            ctx.fillRect(0, 0, 800, 500);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // ========== 環境管理 ==========
        function setEnvironment(bgInfo, bgImageURL = "", bgmInfo = "") {
            if (bgInfo || bgmInfo) {
                bgPlaceholder.innerHTML = `[${bgInfo}]<br><span style="font-size:1.2rem;">[${bgmInfo}]</span>`;
            } else {
                bgPlaceholder.innerHTML = "";
            }
            if (bgImageURL) {
                bgLayer.style.backgroundImage = `url(${bgImageURL})`;
            }
        }

        // ========== 各種進行用の制御関数 ==========
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        const waitClick = () => {
            return new Promise(resolve => {
                const indicator = document.getElementById('indicator');
                if (indicator) indicator.style.display = 'block';
                const handler = () => {
                    window.removeEventListener('keydown', keyHandler);
                    screen.removeEventListener('click', handler);
                    if (indicator) indicator.style.display = 'none';
                    resolve();
                };
                const keyHandler = (e) => { if (e.key === 'Enter' || e.key === ' ') handler(); };
                setTimeout(() => {
                    screen.addEventListener('click', handler);
                    window.addEventListener('keydown', keyHandler);
                }, 100);
            });
        };

        const askChoices = (choices) => {
            return new Promise(resolve => {
                const area = document.getElementById('choices-area');
                area.innerHTML = '';
                choices.forEach((text, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = text;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        area.innerHTML = '';
                        resolve(i + 1);
                    };
                    area.appendChild(btn);
                });
            });
        };

        const setMsg = (speaker, txt) => {
            document.getElementById('speaker-name').innerText = speaker ? speaker : "";
            document.getElementById('dialogue-text').innerText = txt;
        };

        // ========== ゲームメインシナリオ ==========
        async function startSimulation() {
            // テキストボックスは日常パートまで一旦隠す
            textBox.style.display = "none";

            // --- ① 多色ワープ演出 (4秒) ---
            warpMode = "multi"; warpSpeed = 8;
            setEnvironment("仮想空間演出：多色高速移動", "", "BGM: 電子音あり");
            await sleep(4000);

            // --- ② 言語自動選択 (1秒) ---
            warpSpeed = 3;
            centerUi.innerHTML = `
                      <div id="lang-ui">
                          <div class="lang-option">Language ➤ English</div>
                          <div class="lang-option" id="lang-jp">Language ➤ Japanese</div>
                      </div>
                  `;
            await sleep(200);
            document.getElementById('lang-jp').classList.add('active');
            setEnvironment("演出：Language自動選択", "", "SE: 決定音");
            await sleep(1000);
            centerUi.innerHTML = "";

            // --- ③ ログイン画面自動入力 (1秒) ---
            centerUi.innerHTML = `<div id="login-ui">Log in<br>account : <span id="acc"></span><br>password : <span id="pass"></span></div>`;
            setEnvironment("演出：ログイン画面自動入力", "", "SE: 入力音");
            let accStr = "ozawa2026", passStr = "********";
            for (let i = 0; i < accStr.length; i++) {
                document.getElementById('acc').innerHTML += accStr[i]; await sleep(40);
            }
            for (let i = 0; i < passStr.length; i++) {
                document.getElementById('pass').innerHTML += passStr[i]; await sleep(40);
            }
            await sleep(600);
            centerUi.innerHTML = "";

            // --- ④ プレイヤー名入力 ---
            setEnvironment("演出：プレイヤー名入力待ち", "", "");
            centerUi.innerHTML = `
                      <div id="input-ui">
                          <div style="color:#00f3ff; margin-bottom:15px; font-size:1.1rem; letter-spacing:2px;">ENTER USERNAME</div>
                          <input type="text" id="name-in" maxlength="10" placeholder="プレイヤー名を入力" autofocus><br>
                          <button id="name-btn">ENTER</button>
                      </div>
                  `;
            await new Promise(resolve => {
                const btn = document.getElementById('name-btn');
                const input = document.getElementById('name-in');
                const proceed = () => {
                    if (input.value.trim()) playerName = input.value.trim();
                    resolve();
                };
                btn.onclick = proceed;
                input.onkeydown = (e) => { if (e.key === 'Enter') proceed(); };
            });
            centerUi.innerHTML = "";

            // --- ⑤-1 Welcome表示 (2秒) ---
            centerUi.innerHTML = `<div id="welcome-ui">Welcome to Ozawa Seminar !</div>`;
            await sleep(50);
            document.getElementById('welcome-ui').classList.add('show');
            setEnvironment("演出：Welcome表示（インパクト重視）", "", "SE: 電子音（強）");
            await sleep(2000);

            // --- ⑤-2 青系ワープ加速 ＆ ホワイトアウト (3秒) ---
            warpMode = "blue"; warpSpeed = 25;
            document.getElementById('welcome-ui').style.transition = "transform 3s ease-in, opacity 1s";
            document.getElementById('welcome-ui').style.transform = "scale(0.01)";
            setEnvironment("演出：青系ワープ空間へ吸い込み", "", "高速移動演出");
            await sleep(2500);

            whiteout.style.opacity = "1";
            await sleep(500);

            // --- 演出終了・日常パートへ移行 ---
            warpMode = "stop";
            ctx.clearRect(0, 0, 800, 500);
            canvas.style.display = "none";
            centerUi.innerHTML = "";
            whiteout.style.opacity = "0";
            textBox.style.display = "block";

            // ==================== 日常編 ====================
            setEnvironment("背景A：廊下", "", "BGM A：足音");
            setMsg(playerName, "今日から経済学部最強の小澤ゼミが始まるぞ。まずは教室に向かおう。");
            await waitClick();

            setMsg(playerName, "（歩き始めた足は教室に近づくにつれて軽くなる。気づかぬうちに新たな挑戦に心が昂っているのだろう。）");
            await waitClick();

            setEnvironment("背景B：ドア前", "", "BGM A：足音停止（フェードアウト）");
            setMsg("", "（そんなことを思っている間に教室に着いていた。）");
            await waitClick();

            setEnvironment("背景C：ドア開（ホワイトアウト）", "", "SE：ドア開");
            setMsg(playerName, "（教室の扉を開けた瞬間、新たな高みに踏み入ったことを自覚する。）");
            await waitClick();

            setEnvironment("背景D：教室ドア前", "", "BGM：賑やか");
            setMsg(playerName, "賑やかだな。");
            await waitClick();

            setMsg(playerName, "よーしとりあえず...");
            await sleep(500);

            // 【選択肢A】
            while (true) {
                let choiceA = await askChoices(["①小澤先生に挨拶に行く", "②ゼミ生に挨拶に行く"]);
                if (choiceA === 1) {
                    setEnvironment("背景E：教室黒板前（画面右から黒く移動風）", "", "BGM：賑やか");
                    setMsg(playerName, "小澤先生！本日からよろしくお願いします！");
                    await waitClick();
                    setMsg("小澤先生", "おう、よう来たな。そんな固くならんでええ。適当に座れ。");
                    await waitClick();
                    break;
                } else {
                    if (Math.random() < 0.5) {
                        setEnvironment("背景F：教室窓側", "", "BGM：賑やか");
                        setMsg("けいご", "おいおい。先に先生への挨拶や。筋は通しとかねぇとな。");
                    } else {
                        setEnvironment("背景G：教室廊下側", "", "BGM：賑やか");
                        setMsg("ぜん", "小澤先生をスルーとはとんでもない新入りが入ってきたもんやな。");
                    }
                    await waitClick();
                }
            }

            // 【選択肢B】
            setEnvironment("背景H：教室黒板前逆向き", "", "BGM：賑やか");
            setMsg(playerName, "どこに座ろうかな？");
            let choiceB = await askChoices(["①資料を読んでいる先輩のところに行く", "②話している先輩のところに行く"]);

            if (choiceB === 1) {
                setMsg(playerName, "真面目そうだな。よし。"); await waitClick();
                setMsg(playerName, `${playerName}です。今日からからよろしくお願いします。`); await waitClick();
                setMsg("健太", "よろしく。今日は初めて？"); await waitClick();
                setMsg(playerName, "はい、今日が初めてです。"); await waitClick();
                setMsg("健太", "そっか。最初は緊張するよね。聞きたいことがあったらなんでも聞いてね。"); await waitClick();
            } else {
                setMsg(playerName, "賑やかそうだな。よし.。。"); await waitClick();
                setMsg(playerName, `${playerName}です！今日からからよろしくお願いします！`); await waitClick();
                setMsg("行", "おぉ！これからよろしくね！！"); await waitClick();
                setMsg("然", "おぉ今日初めてか！そんな固くならなくて大丈夫よ。"); await waitClick();
                setMsg(playerName, "すごく緊張してます。"); await waitClick();
                setMsg("行", "最初はみんなそんな感じだったよ。");
                setMsg("然", "わからないことあったら何でも聞いてくれい. 。"); await waitClick();
            }

            setMsg(playerName, "じゃあ...");
            await waitClick();

            // 【選択肢C】
            let choiceC = await askChoices(["①「ディスカッションって役割分担とかあるんですか？」", "②「このゼミってどんな人がいるんですか？」"]);

            if (choiceC === 1) {
                let s = choiceB === 1 ? "健太" : "行";
                setMsg(playerName, "ディスカッションって役割分担とかあるんですか？"); await waitClick();
                setMsg(s, "あるよ。毎回班ごとに決めるんだ。発表者にタイムキーパー、進行役や記録係が主な役割だよ。最初は周りの先輩を頼るといいよ。"); await waitClick();
                setMsg(playerName, "はい。そうします。"); await waitClick();
                setMsg(choiceB === 1 ? "真面目A先輩" : "然", "せっかくだから今日のThe Wall Street Journalを一緒に見てみようか。"); await waitClick();
            } else {
                setMsg(playerName, "このゼミってどんな人がいるんですか？"); await waitClick();
                if (choiceB === 1) {
                    setMsg("こうすけ", "いろんな人がいるよ。私たちの代はお酒が好きな人が多いかな？やる気がなさそうに見えるけど、秘めてる力は底が見えないよ。"); await waitClick();
                    setMsg("こうすけ", "ディスカッションになると急に人が変わったように饒舌になる人もいるかな。普段は静かなのに、議論が始まるとまるで別人みたいになるんだよね。"); await waitClick();
                    setMsg("このみ", "そうなんだ。せっかくだし、このまま今日のThe Wall Street Journalを一緒に見てみようか。"); await waitClick();
                } else {
                    setMsg("行", "いろんな人がいるよ。機謙がいいと帰りにみんなにドーナツをおごしてくれる人がいるよ。"); await waitClick();
                    setMsg("然", "インドネシアに帰省しているのにオンラインで馬券を買っている人がいるよ。"); await waitClick();
                    setMsg("はる", "旅行好きで海外によく行ってお土産を買ってきてくれるんだけど、その買ってきてくれるお土産すべてが美味しくない人がいるよ。"); await waitClick();
                    setMsg("然", "ｿｳﾀﾞﾖ。せっかくだし、このまま今日のThe Wall Street Journalを一緒に見てみようか。"); await waitClick();
                }
            }

            setMsg(playerName, "はい。ありがとうございます。");
            await waitClick();

            // 【選択肢D】
            setEnvironment("ディスカッション開始", "", "SE/BGM連動箇所");
            setMsg("はる", "ディスカッション始めるよー！班作ってー！"); await waitClick();
            setMsg(playerName, "誰と一緒の班になろうか？");
            let choiceD = await askChoices(["①「真面目そうな人」のところに行く", "②「雰囲気良さそうだな。あそこに行ってみるか。」"]);

            if (choiceD === 1) {
                setMsg("葵", "人数ちょうどいいからぜひぜひ。"); await waitClick();
                setMsg("行", "じゃア簡単に自己紹介しますか。僕/私は行で趣味は競馬だよ。でこっちは遠山だよ。"); await waitClick();
                setMsg("遠山", "よろしく。趣味は漫画だよ。"); await waitClick();
            } else {
                setMsg(playerName, "雰囲気良さそうだな。あそこに行ってみるか！"); await waitClick();
                setMsg("遠山", "ちょうど人探してたところ！一緒にやろうか！！"); await waitClick();
                setMsg("遠山", "よろしくね！僕/私は遠山で趣味は漫画だよ。で、こっちが行だよ。"); await waitClick();
                setMsg("行", "よろしく。趣味は競馬だよ。"); await waitClick();
            }

            setMsg(playerName, `${playerName}です。よろしくお願いします。`); await waitClick();
            setMsg("はる", "ディスカッション始めまーす。"); await waitClick();
            setMsg("ナレーション", "その後、時間を忘れるほど白熱した議論が交わされた……。"); await waitClick();

            // ==================== 合宿編 (変更箇所) ====================
            whiteout.style.opacity = "1";
            await sleep(1000);
            whiteout.style.opacity = "0";

            setEnvironment("背景：集合場所", "", "BGM：出発前の賑わい");
            setMsg("同期１", "おはよー！！結構みんな集まってきたね！"); await waitClick();
            setMsg("同期２", "まじで合宿楽しみだね！！部屋どんな感じなんだろ！"); await waitClick();
            setMsg("先輩", "出発までまだもう少し時間あるから、トイレとか済ませといてねー！"); await waitClick();

            // 集合場所の選択肢
            let choiceCampA = await askChoices(["① 友達とお昼ご飯を買いに行く", "② 10分前に到着して持ち物を確認しておく"]);
            if (choiceCampA === 1) {
                setMsg("同期", "コンビニ寄ろ！絶対途中でおなかすいちゃうわ！！"); await waitClick();
                setMsg(playerName, "行こ！！お菓子買いたい！"); await waitClick();
            } else {
                setMsg(playerName, "早めに着けてよかった～・・・"); await waitClick();
                setMsg("同期", "もう準備終わってるの！はやっ！！"); await waitClick();
            }

            setEnvironment("背景：バス車内", "", "BGM：走行音と笑い声");
            setMsg("ナレーション", "バスが出発した。周りから楽しそうな笑い声が聞こえる。"); await waitClick();
            setMsg("同期", "こっち席空いてるよ！"); await waitClick();

            // バス内の選択肢
            let choiceCampB = await askChoices(["① 何時に着くのか合宿スケジュールを確認しておく", "② 周りの人と雑談して盛り上がる"]);
            if (choiceCampB === 1) {
                setMsg(playerName, "13時ごろに着くのか、今日も長いし少し寝とこうかな"); await waitClick();
                setMsg("同期", "今日も結構詰まってるんだね！私も少し寝とこうかな！"); await waitClick();
            } else {
                setMsg("同期", "みんなで話してたらあっという間だね！！"); await waitClick();
            }

            setEnvironment("背景：宿・ディスカッションルーム", "", "BGM：真剣な議論");
            setMsg("ナレーション", "宿に到着し、ディスカッションが始まる。ディスカッションを終え----"); await waitClick();
            setMsg("同期１", "ディスカッション疲れたねーー"); await waitClick();
            setMsg("同期２", "夜ご飯まで少し時間あるみたいだけど、この後どうする？"); await waitClick();

            // 夕食前の選択肢
            let choiceCampC = await askChoices(["① 先に荷物整理を終わらせる", "② 付近を探索してみる"]);
            if (choiceCampC === 1) {
                setMsg(playerName, "後でバタバタしたくないし、片づけとかお風呂の準備先にしておこう！！"); await waitClick();
            } else {
                setMsg("同期", "徒歩15分ぐらいのとこにコンビニあるっぽいよ！"); await waitClick();
                setMsg(playerName, "探索がてら行ってみよう！"); await waitClick();
            }

            setEnvironment("背景：大広間", "", "BGM：賑やかな夕食");
            setMsg("ナレーション", "大広間で夜ご飯。おいしそうなごはんがずらりと並んでいる。"); await waitClick();
            setMsg("先輩", "席自由だから、好きなところ座ってー！"); await waitClick();

            // 夕食時の選択肢
            let choiceCampD = await askChoices(["① みんなとの会話を楽しむ", "② 履修について先輩に聞く"]);
            if (choiceCampD === 1) {
                setMsg("同期", "このゼミ思ったより雰囲気良いよね！！"); await waitClick();
                setMsg(playerName, "それ思った！先輩たちとも仲良くなれるのめっちゃいいよね！"); await waitClick();
            } else {
                setMsg(playerName, "おすすめの授業とかありますか？？"); await waitClick();
                setMsg("先輩", "小澤先生の企画講座面白いよ！！"); await waitClick();
            }

            setEnvironment("背景：部屋（飲み会）", "", "BGM：夜の懇親会");
            setMsg("ナレーション", "部屋に集まって飲み会が始まった。お酒を飲みながら話したり、カードゲームをしたり、みんな思い思いに過ごしている。"); await waitClick();
            setMsg("同期", "もうこんな時間だ！そろそろ寝なくちゃ"); await waitClick();
            setMsg(playerName, "時間が経つのがあっという間だね。おやすみ！"); await waitClick();
            setMsg("同期", "おやすみ～"); await waitClick();

            setEnvironment("背景：部屋（朝）", "", "BGM：朝のアラーム");
            setMsg("ナレーション", "合宿2日目の朝。アラームの音で目が覚める。"); await waitClick();

            // 朝の選択肢
            let choiceCampF = await askChoices(["① ぎりぎりまで寝てから朝食を食べに行く", "② 早起きして準備を終えてから朝食を食べる"]);
            if (choiceCampF === 1) {
                setMsg("同期", "おはよー！もうすぐ朝ご飯の時間だね！"); await waitClick();
                setMsg(playerName, "夜更かししたからまだ眠いなあ。あと10分だけ寝よう…"); await waitClick();
            } else {
                setMsg(playerName, "そろそろ朝食だから支度をしよう！"); await waitClick();
            }

            setEnvironment("背景：ミーティングルーム", "", "BGM：発表前の緊張感");
            setMsg("ナレーション", "午後は学年ゼミの発表だ。プレゼンに向けて班のメンバーと集まった。"); await waitClick();

            // 発表前の選択肢
            let choiceCampG = await askChoices(["① メンバーとの会話を楽しみ、緊張をほぐす", "② プレゼン内容の最終確認をする"]);
            if (choiceCampG === 1) {
                setMsg("同期", "今日の自由時間なにして遊ぼっか～"); await waitClick();
                setMsg(playerName, "みんなで買い物したり運動したりするのも楽しそう！緊張がほぐれてきた！"); await waitClick();
            } else {
                setMsg(playerName, "最終確認もできたし、これでプレゼンはばっちりだ！"); await waitClick();
            }

            setEnvironment("背景：合宿所・ロビー", "", "BGM：解放感のある音楽");
            setMsg("ナレーション", "学年ゼミが終わり、自由時間がきた。"); await waitClick();

            // 自由時間の選択肢
            let choiceCampH = await askChoices(["① 体育館で遊ぶ", "② 片づけをしてから体育館に向かう"]);
            if (choiceCampH === 1) {
                setMsg(playerName, "自由時間だ！体育館で遊ぼう！！"); await waitClick();
            } else {
                setMsg("同期", "体育館で遊ぼう！何する！？"); await waitClick();
            }

            setEnvironment("背景：体育館", "", "BGM：スポーツの音");
            setMsg("ナレーション", "【Iパートへ】"); await waitClick();


            // 終了処理
            setEnvironment("ゲームクリア", "", "");
            setMsg("SYSTEM", "小澤ゼミ紹介シミュレーション（日常編＆合宿編） すべての動作確認終了です。");
            document.getElementById('choices-area').innerHTML = `<button class="choice-btn" onclick="location.reload()">最初からやり直す</button>`;
        }

        startSimulation();
    </script>
</body>

</html>
