<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小澤ゼミ紹介シミュレーション</title>
    <style>
        .nav-links a {
            text-decoration: none;
            color: inherit;
            font-size: 14px;
            font-weight: bold;
            padding: 20px 0;
            display: block;
        }

        /* 👇 ここを追加してください */
        .nav-links a.active {
            color: #000000 !important;
        }

        /* ==========================================
   🌐 ヘッダーとナビゲーション
   ========================================== */
        .main-header {
            background-color: #fff;
            padding: 15px 20px;
            border-bottom: 4px solid #5c4033;
            /* 太めのレトロな線 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            height: 60px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #ff4d6d;
            /* イチゴ色のピンクレッド */
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links>li {
            position: relative;
        }

        .nav-links a {
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            display: block;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background-color: #ffccd5;
            color: #ff4d6d;
        }

        /* ドロップダウンメニュー */
        .dropdown-content {
            display: none;
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            border: 3px solid #5c4033;
            border-radius: 8px;
            padding: 10px;
            list-style: none;
            z-index: 1010;
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        /* ドロップダウンメニューの隙間を埋める透明な橋 */
        .dropdown-content::before {
            content: "";
            position: absolute;
            top: -40px;
            /* 上に40px分の橋を伸ばす */
            left: 0;
            width: 100%;
            height: 20px;
            background-color: transparent;
            /* 色は透明にして見えなくする */
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content li {
            margin: 5px 0;
            list-style: none;
        }

        .dropdown-content a {
            display: block;
            padding: 10px 15px;
            color: #333;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
        }

        .header-right {
            font-weight: 700;
            background: #fff0f2;
            padding: 5px 15px;
            border: 3px solid #5c4033;
            border-radius: 20px;
        }

        /* ========== 全体スタイル (ノベルゲーム仕様) ========== */
        body {
            background-color: #050508;
            color: #eee;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            width: 800px;
            height: 500px;
            margin: 50px auto;
            /* 👈 これを追加するだけで画面がド真ん中に来ます！ */
            background-color: #000;
            background-size: cover;
            background-position: center;
            border: 2px solid #333;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* 後から写真を入れるための背景レイヤー */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center;
            transition: background 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 後ほど写真を入れる場所の「目印（薄い文字）」 */
        #bg-placeholder {
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.12);
            /* 奥で非常に薄く表示 */
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            z-index: 1;
        }

        /* 演出用キャンバス（リンクスタートの光） */
        #cyber-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* 画面レイヤー（下詰めに配置） */
        .screen-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* テキストボックスなどを下部に配置 */
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }

        /* ホワイトアウト用マスク */
        #whiteout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 暗転（ブラックアウト）用の設定 */
        #blackout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            opacity: 0;
            z-index: 2;
            /* 手前の文字の後ろになるように2に設定 */
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 画面中央に浮き出る文字用の設定 */
        .popup-narration {
            font-size: 1.5rem;
            color: #ffffff !important;
            opacity: 0;
            letter-spacing: 2px;
            line-height: 1.8;
            text-align: center;
            transition: opacity 1.5s ease;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            width: 600px;
        }

        .popup-narration.show {
            opacity: 1 !important;
        }

        /* ========== 演出用UI（画面中央に浮かせるもの） ========== */
        .center-ui {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            z-index: 4;
            text-align: center;
        }

        /* ②言語選択 */
        #lang-ui {
            border: 2px solid #00f3ff;
            background: rgba(0, 10, 20, 0.85);
            padding: 20px 40px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .lang-option {
            font-size: 1.5rem;
            margin: 10px 0;
            color: #555;
        }

        .lang-option.active {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
        }

        /* ③ログイン画面 */
        #login-ui {
            font-size: 1.3rem;
            color: #00f3ff;
            text-align: left;
            width: 300px;
            background: rgba(0, 5, 10, 0.85);
            padding: 20px;
            border-left: 4px solid #00f3ff;
        }

        /* ④プレイヤー名入力 */
        #input-ui input {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-bottom: 2px solid #00f3ff;
            color: #fff;
            font-size: 1.6rem;
            text-align: center;
            outline: none;
            padding: 10px;
            margin-bottom: 20px;
            width: 300px;
        }

        #input-ui button {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #00f3ff;
        }

        /* ⑤Welcome大文字 */
        #welcome-ui {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
            transform: scale(0.5);
            opacity: 0;
            transition: transform 2s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 1s;
        }

        #welcome-ui.show {
            transform: scale(1.1);
            opacity: 1;
        }

        /* ========== ゲーム本編（下部テキストボックス） ========== */
        #text-box {
            width: 100%;
            height: 135px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #334466;
            border-radius: 8px;
            padding: 15px 25px;
            box-sizing: border-box;
            font-size: 1.25rem;
            line-height: 1.6;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
        }

        #speaker-name {
            color: #00f3ff;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1rem;
            height: 1.2rem;
        }

        #dialogue-text {
            color: #fff;
        }

        /* 選択肢ボタンの表示位置（テキストボックスの上） */
        #choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
            margin-bottom: 15px;
            z-index: 6;
        }

        .choice-btn {
            width: 100%;
            background: rgba(15, 20, 35, 0.9);
            color: #fff;
            border: 1px solid #4466aa;
            padding: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            text-align: center;
        }

        .choice-btn:hover {
            background: #335599;
            border-color: #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        #indicator {
            position: absolute;
            bottom: 15px;
            right: 30px;
            color: #4466aa;
            font-size: 0.9rem;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }
    </style>

        <meta charset="UTF-8">

        <style>
            body {
                margin: 0;

<body>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ozawa seminar</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header class="main-header">
            <nav class="nav-container">
                <div class="logo">🍓 小澤ゼミ / Ozawa Seminar 🍓</div>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">🏠 ホーム</a></li>
                    <li class="dropdown">
                        <a href="#">📢 活動内容 ▼</a>
                        <ul class="dropdown-content">
                            <li><a href="activities-member.html">👥 メンバー紹介</a></li>
                            <li><a href="activities-event.html">📅 年間行事</a></li>
                        </ul>
                    </li>
                    <li><a href="activities-ozawaquiz.html">🧐 先生について ▼</a></li>
                    <li class="dropdown">
                        <a href="#">🎮 君もゼミ生だ！ ▼</a>
                        <ul class="dropdown-content">
                            <li><a href="simulation-daily.html">☀️シュミレーションゲームはこちら！</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="header-right">
                    <span>MENU 📋</span>
                </div>
            </nav>
        </header>

        <div id="game-container">
            <div id="bg-layer">
                <div id="bg-placeholder"></div>
            </div>

            <div id="character-layer"
                style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; display: flex; justify-content: center; align-items: flex-end;">
                <img id="character-img" src="" style="max-height: 90%; display: none;">
            </div>

            <canvas id="cyber-canvas" width="800" height="500"></canvas>

            <div id="whiteout"></div>
            <div id="blackout"></div>
            <video id="game-video" src="803374691.495790.mp4"
                style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1;"
                loop muted playsinline></video>

            <div id="screen" class="screen-layer">
                <div id="center-ui-container" class="center-ui"></div>

                <div id="choices-area"></div>
                <div id="text-box">
                    <div id="speaker-name"></div>
                    <div id="dialogue-text"></div>
                    <div id="indicator" style="display:none;">▼ ENTER</div>
                </div>
            </div>
        </div>

        <script>
            const canvas = document.getElementById('cyber-canvas');
            const ctx = canvas.getContext('2d');
            const screen = document.getElementById('screen');
            const whiteout = document.getElementById('whiteout');
            const blackout = document.getElementById('blackout');
            const centerUi = document.getElementById('center-ui-container');
            const textBox = document.getElementById('text-box');
            const bgPlaceholder = document.getElementById('bg-placeholder');
            const bgLayer = document.getElementById('bg-layer');

            let playerName = "主人公";
            let warpSpeed = 2;
            let warpMode = "multi";

            // 内部集計用（性格診断用ポイント）
            let scoreE = 0; // 社交
            let scoreT = 0; // 論理
            let scoreJ = 0; // 計画
            let scoreP = 0; // 突発

            // ========== ①〜⑤ 演出用パーティクルシステム ==========
            const colors = {
                multi: ['#888888', '#ff007f', '#ffff00', '#00ffff', '#7fff00', '#ff0000'],
                blue: ['#0033ff', '#0099ff', '#00ffff', '#ffffff']
            };
            class Particle {
                constructor() { this.reset(); this.z = Math.random() * 800; }
                reset() {
                    this.x = (Math.random() - 0.5) * 800;
                    this.y = (Math.random() - 0.5) * 500;
                    this.z = 800;
                    this.color = colors[warpMode] ? colors[warpMode][Math.floor(Math.random() * colors[warpMode].length)] : '#fff';
                }
                update() { this.z -= warpSpeed; if (this.z <= 0) this.reset(); }
                draw() {
                    if (warpMode === "stop") return;
                    let k = 300 / this.z;
                    let px = this.x * k + 400; let py = this.y * k + 250;
                    if (px >= 0 && px <= 800 && py >= 0 && py <= 500) {
                        ctx.fillStyle = this.color;
                        let size = (800 - this.z) * 0.01;
                        ctx.fillRect(px, py, size, size * 2);
                    }
                }
            }
            const particles = Array.from({ length: 150 }, () => new Particle());
            function animate() {
                ctx.fillStyle = 'rgba(5, 5, 10, 0.3)';
                ctx.fillRect(0, 0, 800, 500);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();

            // ========== 環境管理 ==========
            function setEnvironment(bgInfo, bgImageURL = "", bgmInfo = "") {
                // 画面に文字を出す処理を消して、常に空っぽ（見えない状態）にします
                bgPlaceholder.innerHTML = "";

                // 写真が指定された時だけ、背景を切り替える
                if (bgImageURL) {
                    bgLayer.style.backgroundImage = `url(${bgImageURL})`;
                }
            }

            // ★ここに追加：キャラクター表示用の関数
            function setChar(charImageURL) {
                const charImg = document.getElementById('character-img');
                if (charImageURL) {
                    charImg.src = charImageURL;
                    charImg.style.display = "block"; // 画像があれば表示する
                } else {
                    charImg.style.display = "none";  // 空っぽなら隠す
                    charImg.src = "";
                }
            }

            // ========== 各種進行用の制御関数 ==========
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const waitClick = () => {
                return new Promise(resolve => {
                    const indicator = document.getElementById('indicator');
                    if (indicator) indicator.style.display = 'block';
                    const handler = () => {
                        window.removeEventListener('keydown', keyHandler);
                        screen.removeEventListener('click', handler);
                        if (indicator) indicator.style.display = 'none';
                        resolve();
                    };
                    const keyHandler = (e) => { if (e.key === 'Enter' || e.key === ' ') handler(); };
                    setTimeout(() => {
                        screen.addEventListener('click', handler);
                        window.addEventListener('keydown', keyHandler);
                    }, 100);
                });
            };

            const askChoices = (choices) => {
                return new Promise(resolve => {
                    const area = document.getElementById('choices-area');
                    area.innerHTML = '';
                    choices.forEach((text, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.innerText = text;
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            area.innerHTML = '';
                            resolve(i + 1);
                        };
                        area.appendChild(btn);
                    });
                });
            };

            // 話者変更時の一瞬暗転用変数
            let lastSpeaker = null;

            const setMsg = async (speaker, txt) => {
                const speakerNameElem = document.getElementById('speaker-name');
                const dialogueTextElem = document.getElementById('dialogue-text');

                // 日常・合宿の本編中(textBoxが表示されている)かつ、話者が変わった時のみ一瞬暗転
                // 主人公のセリフ、心の声（空文字）、ナレーションなどは暗転から除外する
                if (textBox.style.display === "block" &&
                    lastSpeaker !== null &&
                    lastSpeaker !== speaker &&
                    speaker !== playerName &&
                    speaker !== "" &&
                    speaker !== "ナレーション" &&
                    speaker !== "SYSTEM") {

                    blackout.style.transition = "opacity 0.12s ease";
                    blackout.style.opacity = "0.85"; // 一瞬画面を暗く落とす
                    await sleep(120);

                    speakerNameElem.innerText = speaker ? speaker : "";
                    dialogueTextElem.innerText = txt;

                    blackout.style.opacity = "0";
                    await sleep(120);
                    blackout.style.transition = "opacity 0.5s ease"; // 元の設定に戻す
                } else {
                    speakerNameElem.innerText = speaker ? speaker : "";
                    dialogueTextElem.innerText = txt;
                }
                lastSpeaker = speaker;
            };

            // ========== ゲームメインシナリオ ==========
            async function startSimulation() {
                // テキストボックスは日常パートまで一旦隠す
                textBox.style.display = "none";

                // --- ① 多色ワープ演出 (4秒) ---
                warpMode = "multi"; warpSpeed = 8;
                setEnvironment("仮想空間演出：多色高速移動", "", "BGM: 電子音あり");
                await sleep(4000);

                // --- ② 言語自動選択 (1秒) ---
                warpSpeed = 3;
                centerUi.innerHTML = `
                  <div id="lang-ui">
                      <div class="lang-option">Language ➤ English</div>
                      <div class="lang-option" id="lang-jp">Language ➤ Japanese</div>
                  </div>
              `;
                await sleep(200);
                document.getElementById('lang-jp').classList.add('active');
                setEnvironment("演出：Language自動選択", "", "SE: 決定音");
                await sleep(1000);
                centerUi.innerHTML = "";

                // --- ③ ログイン画面自動入力 (1秒) ---
                centerUi.innerHTML = `<div id="login-ui">Log in<br>account : <span id="acc"></span><br>password : <span id="pass"></span></div>`;
                setEnvironment("演出：ログイン画面自動入力", "", "SE: 入力音");
                let accStr = "ozawa2026", passStr = "********";
                for (let i = 0; i < accStr.length; i++) {
                    document.getElementById('acc').innerHTML += accStr[i]; await sleep(40);
                }
                for (let i = 0; i < passStr.length; i++) {
                    document.getElementById('pass').innerHTML += passStr[i]; await sleep(40);
                }
                await sleep(600);
                centerUi.innerHTML = "";

                // --- ④ プレイヤー名入力 ---
                setEnvironment("演出：プレイヤー名入力待ち", "", "");
                centerUi.innerHTML = `
                  <div id="input-ui">
                      <div style="color:#00f3ff; margin-bottom:15px; font-size:1.1rem; letter-spacing:2px;">ENTER USERNAME</div>
                      <input type="text" id="name-in" maxlength="10" placeholder="プレイヤー名を入力" autofocus><br>
                      <button id="name-btn">ENTER</button>
                  </div>
              `;
                await new Promise(resolve => {
                    const btn = document.getElementById('name-btn');
                    const input = document.getElementById('name-in');
                    const proceed = () => {
                        if (input.value.trim()) playerName = input.value.trim();
                        resolve();
                    };
                    btn.onclick = proceed;
                    input.onkeydown = (e) => { if (e.key === 'Enter') proceed(); };
                });
                centerUi.innerHTML = "";

                // --- ⑤-1 Welcome表示 (2秒) ---
                centerUi.innerHTML = `<div id="welcome-ui">Welcome to Ozawa Seminar !</div>`;
                await sleep(50);
                document.getElementById('welcome-ui').classList.add('show');
                setEnvironment("演出：Welcome表示（インパクト重視）", "", "SE: 電子音（強）");
                await sleep(2000);

                // --- ⑤-2 青系ワープ加速 ＆ ホワイトアウト (3秒) ---
                warpMode = "blue"; warpSpeed = 25;
                document.getElementById('welcome-ui').style.transition = "transform 3s ease-in, opacity 1s";
                document.getElementById('welcome-ui').style.transform = "scale(0.01)";
                setEnvironment("演出：青系ワープ空間へ吸い込み", "", "高速移動演出");
                await sleep(2500);

                whiteout.style.opacity = "1";
                await sleep(500);

                // --- 演出終了・日常パートへ移行 ---
                warpMode = "stop";
                ctx.clearRect(0, 0, 800, 500);
                canvas.style.display = "none";
                centerUi.innerHTML = "";
                whiteout.style.opacity = "0";
                textBox.style.display = "block";
                lastSpeaker = null; // 日常パート開始時に話者リセット

                await setMsg("こうすけ", "うおっ、思ったより伸びた！誰かカバー！！"); await waitClick();

                setChar("");
                await setMsg(playerName, "うわ、！前からボールが！！……って、え？ 待って、あれバレーボールじゃなくて……バスケットボール！？"); await waitClick();

                setChar("photo.jpg/hinako.png");
                await setMsg("ひなこ", "危ない！よけてーーー！！"); await waitClick();

                setChar("");
                await setMsg(playerName, "えっ、あ、ぶふぉっ！！！！！"); await waitClick();

                // 気絶・画面暗転演出
                blackout.style.transition = "opacity 0.1s ease";
                blackout.style.opacity = "1";
                await sleep(600);

                setChar("photo.jpg/aoi.png");
                // 以前直していただいたバッククォート（`）の変数埋め込み、完璧です！
                await setMsg("あおい", `キャーーー！！${playerName}がーーー！？`); await waitClick();

                setChar("photo.jpg/hayato.png");
                await setMsg("はやと", "おいウソだろ！？顔面に直撃したぞ！起きてくれーーー！！"); await waitClick();

                // 長めの暗転から池袋へワープ
                blackout.style.opacity = "1";
                textBox.style.display = "none";
                await sleep(1500);

                // 背景動画を再生（池袋グローバルリング）
                const video = document.getElementById('game-video');
                if (video) {
                    video.style.display = 'block';
                    video.play().catch(e => console.log("Video play error:", e));
                }

                // 背景を池袋グローバルリング（gurorin.jpg）に変更
                setEnvironment("背景：池袋グローバルリング", "photo.jpg/gurorin.jpg", "BGM：街の雑踏");
                blackout.style.opacity = "0";
                textBox.style.display = "block";
                lastSpeaker = null;

                setChar("");
                await setMsg("ナレーション", "目が覚めると、見覚えのある景色が広がっていた。……そこは体育館でも、合宿所でもなく。すっかり日常に戻った、池袋のグローバルリング前だった。"); await waitClick();
                await setMsg(playerName, "あれ……？確か、顔面にボールが当たって……。……って、えええええ！？合宿もう終わってるじゃん！！"); await waitClick();

                // 性格診断の分岐判定（最高得点の軸から算出）
                let isE = scoreE >= scoreT;
                let isJ = scoreJ >= scoreP;
                let resultType = "";

                if (isE && isJ) {
                    resultType = "社交・計画（EJ）タイプ";

                    setChar("photo.jpg/zen.png");
                    await setMsg("ぜん", `お疲れ様！合宿どうだった？ ${playerName}、周りよく見て動いてくれてたから、こっちもすごく助かったよ。`); await waitClick();

                    setChar("photo.jpg/aoi.png");
                    await setMsg("あおい", "ほんとほんと！スケジュール通りに進んだの、絶対そのおかげだよ〜。小澤ゼミってやること多いから、そういう風に一緒に計画立てて動けるの、めちゃくちゃ大事んだよね。"); await waitClick();

                    setChar("photo.jpg/konomi.png");
                    await setMsg("このみ", "最初は課題とかプロジェクトで大変なこともあるかもしれないけど、こうやってみんなで協力してやり遂げたときの達成感、ほんとに最高だから！これからも一緒に頑張ろうね！"); await waitClick();
                }
                else if (isE && !isJ) {
                    resultType = "社交・突発（EP）タイプ";

                    setChar("photo.jpg/kousuke.png");
                    await setMsg("こうすけ", "うぇーい！合宿おつかれ！いやー、主人公のあのフットワークの軽さ、最高だったわ！完全にゼミの空気掴んでたね！"); await waitClick();

                    setChar("photo.jpg/kaito.png");
                    await setMsg("かいと", "間違いない！ぶっちゃけこのゼミ、予定通りにいかないハプニングもしょっちゅうなんだけど（笑）、お前ならそういうのも全部ひっくるめて笑いに変えられそう！"); await waitClick();

                    setChar("photo.jpg/tyura.png");
                    await setMsg("ちゅら", "そうそう！大事なのはとりあえずやってみて、その場を楽しむこと！ノリと勢いがあればなんとでもなるから、これからもうちらと一緒に全力で楽しんでこー！"); await waitClick();
                }
                else if (!isE && isJ) {
                    resultType = "論理・計画（TJ）タイプ";

                    setChar("photo.jpg/keigo.png");
                    await setMsg("けいご", "合宿お疲れ。グループワークでの君の意見、すごく筋が通ってて感心したよ。状況を分析して動くのが得意みたいだね。"); await waitClick();

                    setChar("photo.jpg/haru.png");
                    await setMsg("はる", "小澤ゼミって、ただ仲が良いだけじゃなくて、本気で意見をぶつけ合えるのが良いところなの。妥協せずに議論するからこそ、得られるものも大きいし。"); await waitClick();

                    setChar("photo.jpg/amane.png");
                    await setMsg("あまね", "うん。最初は先輩たちのレベルに圧倒されるかもしれないけど、確実にスキルアップできる環境だから。君ならきっとすぐについてこれると思う。"); await waitClick();

                    setChar("photo.jpg/hinako.png");
                    await setMsg("ひなこ", "これからプロジェクトも本格的になっていくから、一緒に高い目標クリアしていこうね。期待してるよ！"); await waitClick();
                }
                else {
                    resultType = "論理・突発（TP）タイプ";

                    setChar("photo.jpg/hayato.png");
                    await setMsg("はやと", "おつかれー。君、なかなか面白い視点持ってるね。ワークのときのアプローチ、俺らにはない発想でちょっと驚いたわ。"); await waitClick();

                    setChar("photo.jpg/iki.png");
                    await setMsg("いき", "だよね。このゼミ、無難な正解出すより『それ面白くね？』ってアイデアのほうが評価されたりするから。君みたいな柔軟なタイプは絶対向いてる。"); await waitClick();

                    setChar("photo.jpg/kenta.png");
                    await setMsg("けんた", "そうそう、突拍子もないこと言っても、小澤先生もみんなも面白がって乗っかってくれるのがこのゼミのいいところだからさ。これから一緒に、なんかヤバくて面白いこと企もうぜ！"); await waitClick();
                }

                // 共通エンディング（主人公のモノローグ）
                setChar("");
                await setMsg(playerName, "（みんなそれぞれ言ってることは違うし、見ている視点も違うけど……）"); await waitClick();
                await setMsg(playerName, "（共通しているのは、全員がこのゼミを心から楽しんでるってことなんだな。）"); await waitClick();
                await setMsg(playerName, "（……小澤ゼミ、いいな。）"); await waitClick();

                // 最終シャットダウン・リザルト画面移行
                blackout.style.transition = "opacity 0.8s ease";
                blackout.style.opacity = "1";
                textBox.style.display = "none";
                if (video) video.style.display = 'none';
                await sleep(1200);

                // 終了処理・性格診断結果画面
                setEnvironment("診断結果発表", "", "");
                blackout.style.opacity = "0";

                centerUi.innerHTML = `
                <div style="background: rgba(0, 10, 25, 0.9); border: 2px solid #00f3ff; padding: 30px; border-radius: 12px; box-shadow: 0 0 25px rgba(0,243,255,0.5); text-align: center; width: 480px;">
                    <div style="color: #00f3ff; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; letter-spacing: 2px;">DIAGNOSIS RESULT</div>
                    <div style="font-size: 1rem; margin-bottom: 20px; color: #ccc;">あなたの行動から導き出された、小澤ゼミでの適性タイプは……</div>
                    <div style="font-size: 2rem; color: #fff; font-weight: bold; text-shadow: 0 0 10px #00f3ff; margin-bottom: 20px;">${resultType}</div>
                    <button class="choice-btn" onclick="location.reload()">タイトル（最初から）に戻る</button>
                </div>
            `;
            }

            startSimulation();
        </script>
    </body>

</html>
